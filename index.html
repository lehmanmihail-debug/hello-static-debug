<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>🌤️ Погода</h1>
        <button id="theme-toggle" class="theme-toggle" type="button">🌙</button>
      </header>
      <form id="search-form" class="search-form">
        <input id="city-input" type="text" placeholder="Город, например: Москва" required>
        <button type="submit">Найти</button>
      </form>
      <div id="unit-switch" class="unit-switch">
        <button type="button" data-unit="celsius" class="active">°C</button>
        <button type="button" data-unit="fahrenheit">°F</button>
      </div>
      <div id="error" class="error hidden"></div>
      <div id="loading" class="loading hidden"><div class="spinner"></div></div>
      <main id="weather" class="weather hidden">
        <section class="card">
          <h2 id="city-name">—</h2>
          <div class="current-main">
            <span id="current-icon" class="current-icon">☀️</span>
            <span id="current-temp" class="current-temp">—</span>
          </div>
          <p id="current-desc" class="current-desc">—</p>
          <div class="current-details">
            <div class="detail"><span class="detail-label">Ощущается</span><span id="feels-like" class="detail-value">—</span></div>
            <div class="detail"><span class="detail-label">Влажность</span><span id="humidity" class="detail-value">—</span></div>
            <div class="detail"><span class="detail-label">Ветер</span><span id="wind" class="detail-value">—</span></div>
          </div>
        </section>
        <section class="forecast">
          <h2>Прогноз на 5 дней</h2>
          <div id="forecast-list" class="forecast-list"></div>
        </section>
        <footer class="attribution">Данные: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a></footer>
      </main>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
