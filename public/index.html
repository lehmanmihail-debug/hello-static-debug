<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Погода</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1>🌤️ Погода</h1>
        <p class="subtitle">Прогноз по городам мира</p>
      </header>

      <main>
        <section class="card">
          <h2>Выберите город</h2>
          <form id="search-form" class="search-form">
            <input
              id="city-input"
              type="text"
              placeholder="Например: Москва"
              autocomplete="off"
              required
            >
            <button type="submit">Узнать погоду</button>
          </form>
          <p id="status" class="status">Введите название города и нажмите «Узнать погоду»</p>
        </section>

        <section id="weather-card" class="card weather-card hidden">
          <h2 id="city-name">—</h2>
          <div class="weather-main">
            <span id="weather-icon" class="weather-icon">🌡️</span>
            <span id="temperature" class="temperature">—</span>
          </div>
          <p id="weather-description" class="weather-description">—</p>
          <ul class="weather-details">
            <li>💨 Ветер: <span id="wind">—</span></li>
            <li>💧 Влажность: <span id="humidity">—</span></li>
            <li>🌡️ Ощущается как: <span id="feels-like">—</span></li>
          </ul>
        </section>
      </main>

      <footer class="footer">
        <p>Данные: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
        <p>Deployed with ❤️ to GitHub Pages</p>
      </footer>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
