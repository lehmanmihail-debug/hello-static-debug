        <section class="card">
          <h2>Выберите город</h2>
          <form id="search-form" class="search-form">
            <input
              id="city-input"
              type="text"
              placeholder="Например: Москва"
              autocomplete="off"
              required
            >
            <button type="submit">Узнать погоду</button>
          </form>
          <div class="quick-cities">
            <button type="button" onclick="document.getElementById('city-input').value='Москва'; document.getElementById('search-form').dispatchEvent(new Event('submit'))">Москва</button>
            <button type="button" onclick="document.getElementById('city-input').value='Санкт-Петербург'; document.getElementById('search-form').dispatchEvent(new Event('submit'))">СПб</button>
            <button type="button" onclick="document.getElementById('city-input').value='Лондон'; document.getElementById('search-form').dispatchEvent(new Event('submit'))">Лондон</button>
          </div>
          <p id="status" class="status">Введите название города и нажмите «Узнать погоду»</p>
        </section>
